<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>メール確認完了 | Swaply</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffcfc;
    color: #1a1a2e;
    padding: 24px 16px;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
    background: #ffffff;
    border: 1px solid #f0e6ea;
    border-radius: 20px;
    padding: 40px 24px;
  }
  .check {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #D94370;
    color: #ffffff;
    font-size: 38px;
    line-height: 72px;
    font-weight: 700;
  }
  h1 { font-size: 1.35rem; margin: 0 0 12px; color: #1a1a2e; }
  p { margin: 0 0 8px; color: #5a6478; line-height: 1.8; font-size: 0.98rem; }
  .accent { color: #D94370; font-weight: 700; }
  .brand { margin-top: 28px; font-size: 0.85rem; color: #9ca3af; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>メールアドレスの確認が完了しました</h1>
    <p><span class="accent">Swaply</span> アプリに戻って<br>ログインしてください。</p>
    <p>このページは閉じて構いません。</p>
    <div class="brand">Swaply</div>
  </div>
</body>
</html>
